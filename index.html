<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apuração 2º Turno 2026</title>
<meta name="description" content="Evolução ao vivo do percentual de cada candidato a presidente na apuração do 2º turno de 2026, com dados oficiais do TSE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: placar no topo, barra de seções totalizadas, gráfico de linha ocupando a largura */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#14171c; --muted:#5f6672; --line:#e3e6eb; --grid:#eceef2;
  --lula:#d1262b; --flavio:#1f5fd1; --track:#e8ebf0; --fill:#2f8f4e;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1216; --panel:#171b21; --fg:#e8ebf0; --muted:#98a0ac; --line:#262c35; --grid:#20262e;
  --lula:#f0484d; --flavio:#5b8ff0; --track:#262c35; --fill:#43b06a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 32px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:1.35rem;font-weight:600;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font:500 .78rem var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fill)}
.dot.err{background:#d98a00}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2s infinite}}
@keyframes pulse{50%{opacity:.35}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cand{display:grid;gap:2px;min-width:0}
.cand .name{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px}
.cand .sw{width:12px;height:12px;border-radius:3px;flex:none}
.cand .pct{font:500 clamp(1.9rem,6vw,2.8rem)/1.1 var(--mono);font-variant-numeric:tabular-nums}
.cand .votes{color:var(--muted);font:400 .85rem var(--mono);font-variant-numeric:tabular-nums}
.cand.right{text-align:right}.cand.right .name{justify-content:flex-end}
.split{height:10px;border-radius:5px;overflow:hidden;display:flex;margin-top:14px;background:var(--track)}
.split span{display:block;height:100%;transition:width .6s}
.prog{display:grid;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.prog .row b{font:500 1rem var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar span{display:block;height:100%;background:var(--fill);transition:width .6s}
.chart{position:relative;width:100%;height:clamp(260px,48vh,420px)}
canvas{width:100%;height:100%;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
footer{color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Apuração Presidente · 2º turno 2026</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">ao vivo</span></span>
  </header>

  <section class="panel">
    <div class="score">
      <div class="cand" id="cL"><div class="name"><span class="sw" style="background:var(--lula)"></span>LULA</div><div class="pct" id="pL">–</div><div class="votes" id="vL">&nbsp;</div></div>
      <div class="cand right" id="cF"><div class="name">FLÁVIO BOLSONARO<span class="sw" style="background:var(--flavio)"></span></div><div class="pct" id="pF">–</div><div class="votes" id="vF">&nbsp;</div></div>
    </div>
    <div class="split" aria-hidden="true"><span id="sL" style="background:var(--lula);width:50%"></span><span id="sF" style="background:var(--flavio);width:50%"></span></div>
  </section>

  <section class="panel prog">
    <div class="row"><span>Seções totalizadas</span><b id="pst">–</b></div>
    <div class="bar"><span id="pbar" style="width:0"></span></div>
    <div class="row" style="color:var(--muted);font-size:.82rem"><span id="secs">&nbsp;</span><span id="upd">&nbsp;</span></div>
  </section>

  <section class="panel">
    <div class="legend"><span><i style="background:var(--lula)"></i>Lula</span><span><i style="background:var(--flavio)"></i>Flávio Bolsonaro</span><span>% dos votos válidos × % de seções totalizadas</span></div>
    <div class="chart"><canvas id="cv"></canvas></div>
  </section>

  <footer>
    <span>Fonte: <a href="https://resultados.tse.jus.br/oficial/app/index.html#/eleicao/6258/uf/br/cargo/1/vis/nominal/resultados" target="_blank" rel="noopener">resultados.tse.jus.br</a> · consulta a cada 15 s</span>
    <span id="st">&nbsp;</span>
  </footer>
</div>

<script>
const URL_TSE = 'https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.jws';
const KEY = 'apuracao6258';
const SEED = [["25/10/2026 19:32:43",7.1435,50.8265,49.1735],["25/10/2026 19:34:53",8.3115,50.6384,49.3616],["25/10/2026 19:36:03",8.8834,50.5462,49.4538],["25/10/2026 19:37:04",9.425,50.4921,49.5079],["25/10/2026 19:38:03",9.9898,50.4807,49.5193],["25/10/2026 19:38:43",10.4,50.4563,49.5437],["25/10/2026 19:39:33",10.8689,50.4141,49.5859],["25/10/2026 19:41:02",11.6625,50.3572,49.6428],["25/10/2026 19:41:33",11.8953,50.3329,49.6671],["25/10/2026 19:42:08",12.2326,50.2756,49.7244],["25/10/2026 19:42:43",12.6689,50.2327,49.7673],["25/10/2026 19:43:24",12.908,50.198,49.802],["25/10/2026 19:43:43",13.1664,50.1203,49.8797],["25/10/2026 19:44:13",13.3493,50.0508,49.9492],["25/10/2026 19:44:44",13.6507,49.9885,50.0115],["25/10/2026 19:45:23",13.9822,49.9661,50.0339],["25/10/2026 19:45:44",14.2891,49.9751,50.0249],["25/10/2026 19:46:23",14.5705,49.9549,50.0451],["25/10/2026 19:46:43",14.8271,49.9611,50.0389],["25/10/2026 19:47:12",15.0562,49.9173,50.0827],["25/10/2026 19:47:52",15.384,49.904,50.096],["25/10/2026 19:51:54",16.388,49.789,50.211],["25/10/2026 19:52:23",16.659,49.771,50.229],["25/10/2026 19:52:43",16.938,49.755,50.245],["25/10/2026 19:53:23",17.2,49.761,50.239],["25/10/2026 19:53:44",17.491,49.725,50.275],["25/10/2026 19:54:33",18.032,49.678,50.322],["25/10/2026 19:54:53",18.373,49.655,50.345],["25/10/2026 19:55:53",19.199,49.606,50.394],["25/10/2026 19:56:34",19.623,49.567,50.433],["25/10/2026 19:57:03",20.052,49.591,50.409],["25/10/2026 19:57:33",20.299,49.555,50.445],["25/10/2026 19:58:04",20.767,49.511,50.489],["25/10/2026 19:58:33",21.112,49.497,50.503]];
const $ = id => document.getElementById(id);
const num = s => parseFloat(String(s).replace(',', '.'));
const fmtPct = v => v.toFixed(2).replace('.', ',') + '%';
const fmtInt = n => Number(n).toLocaleString('pt-BR');
const dec = s => { const b = atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'='));
  return new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))); };
const keyOf = n => /LULA/i.test(n) ? 'L' : /BOLSONARO/i.test(n) ? 'F' : null;

// histórico: [ts, pst, lula, flavio]
let hist = [];
const merge = arr => { const m = new Map(hist.map(p => [p[0], p])); arr.forEach(p => m.set(p[0], p));
  hist = [...m.values()].sort((a,b) => a[1]-b[1]); };
merge(SEED);
try { merge(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e) {}

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function draw(){
  const cv = $('cv'), dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W = r.width, H = r.height, L = 52, R = 14, T = 10, B = 34;
  g.clearRect(0,0,W,H);
  if (!hist.length) return;
  const muted = css('--muted'), grid = css('--grid'), cL = css('--lula'), cF = css('--flavio');
  const ys = hist.flatMap(p => [p[2], p[3]]);
  const y0 = Math.floor(Math.min(...ys) - 0.5), y1 = Math.ceil(Math.max(...ys) + 0.5);
  const xs = hist.map(p => p[1]);
  const x0 = Math.max(0, Math.floor(Math.min(...xs))), x1 = Math.min(100, Math.max(x0 + 5, Math.ceil(Math.max(...xs) + 2)));
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  g.font = '12px "IBM Plex Mono", ui-monospace, monospace'; g.lineWidth = 1;
  const ystep = [0.25,0.5,1,2,5].find(s => (y1-y0)/s <= 8) || 10;
  for (let v = Math.ceil(y0/ystep)*ystep; v <= y1 + 1e-9; v += ystep) {
    g.strokeStyle = grid; g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W-R, Y(v)); g.stroke();
    g.fillStyle = muted; g.textAlign = 'right'; g.fillText(v.toFixed(ystep < 1 ? 2 : 0).replace('.', ',') + '%', L - 6, Y(v) + 4);
  }
  const xstep = [1,2,5,10,20].find(s => (x1-x0)/s <= Math.max(3, Math.floor((W-L-R)/70))) || 25;
  g.textAlign = 'center';
  for (let v = Math.ceil(x0/xstep)*xstep; v <= x1; v += xstep) {
    g.strokeStyle = grid; g.beginPath(); g.moveTo(X(v), T); g.lineTo(X(v), H-B); g.stroke();
    g.fillStyle = muted; g.fillText(v + '%', X(v), H - B + 18);
  }
  if (y0 < 50 && y1 > 50) { g.strokeStyle = muted; g.setLineDash([5,5]); g.beginPath(); g.moveTo(L, Y(50)); g.lineTo(W-R, Y(50)); g.stroke(); g.setLineDash([]);
    g.fillStyle = muted; g.textAlign = 'left'; g.fillText('50%', L + 4, Y(50) - 5); }
  [[2, cL], [3, cF]].forEach(([i, col]) => {
    g.strokeStyle = col; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
    hist.forEach((p, j) => j ? g.lineTo(X(p[1]), Y(p[i])) : g.moveTo(X(p[1]), Y(p[i]))); g.stroke();
    const last = hist[hist.length-1]; g.fillStyle = col; g.beginPath(); g.arc(X(last[1]), Y(last[i]), 4.5, 0, 7); g.fill();
  });
}

function render(p){
  const c = {}; p.carg[0].agr.forEach(a => a.par.forEach(x => x.cand.forEach(k => { const kk = keyOf(k.nmu); if (kk) c[kk] = k; })));
  if (!c.L || !c.F) throw new Error('candidatos não encontrados');
  const L = num(c.L.pvapn || c.L.pvap), F = num(c.F.pvapn || c.F.pvap), pst = num(p.s.pstn || p.s.pst);
  $('pL').textContent = fmtPct(L); $('pF').textContent = fmtPct(F);
  $('vL').textContent = fmtInt(c.L.vap) + ' votos'; $('vF').textContent = fmtInt(c.F.vap) + ' votos';
  $('sL').style.width = L + '%'; $('sF').style.width = F + '%';
  $('pst').textContent = p.s.pst + '%'; $('pbar').style.width = pst + '%';
  $('secs').textContent = fmtInt(p.s.st) + ' de ' + fmtInt(p.s.ts) + ' seções';
  $('upd').textContent = 'TSE: ' + p.dt + ' ' + p.ht;
  const pt = [p.dt + ' ' + p.ht, +pst.toFixed(4), +L.toFixed(4), +F.toFixed(4)];
  if (!hist.length || hist[hist.length-1][0] !== pt[0]) { merge([pt]); try { localStorage.setItem(KEY, JSON.stringify(hist)); } catch(e) {} }
  draw();
}

async function tick(){
  try {
    const r = await fetch(URL_TSE + '?nocache=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    render(JSON.parse(dec(t.split('.')[1])));
    $('dot').classList.remove('err'); $('liveTxt').textContent = 'ao vivo';
    $('st').textContent = 'Última consulta ' + new Date().toLocaleTimeString('pt-BR');
  } catch (e) {
    $('dot').classList.add('err'); $('liveTxt').textContent = 'reconectando';
    $('st').textContent = 'Falha ao consultar o TSE (' + e.message + '). Nova tentativa em 15 s.';
    draw();
  }
}
window.addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', draw);
draw(); tick(); setInterval(tick, 15000);
</script>
</body>
</html>
